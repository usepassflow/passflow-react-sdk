name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # The browser tests that pull requests skip (`*.release.spec.ts`). A failure
  # stops the release: `publish` needs this job. It holds no credentials.
  release-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release UI tests
        run: pnpm test:release
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

  # Jobs that hold write credentials run on GitHub-hosted runners. npm trusted
  # publishing and provenance also accept only an OIDC token whose
  # runner_environment is github-hosted.
  publish:
    needs: release-tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 6.1.0+ is needed to install the pnpm 12 that packageManager pins.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build project
        run: pnpm build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''

  # The release page is the only record of a version that a reader without npm
  # access can find, and it lapsed for every tag from v0.8.2 to v0.10.0 because
  # nothing created it.
  #
  # It is a SECOND JOB rather than a step, so `contents: write` is never held
  # while `pnpm install`, `pnpm test:unit` and `pnpm build` run third-party code
  # in the publish job — that job keeps `contents: read`. `needs: publish` means
  # a failed publish leaves no page claiming the version shipped. There is no
  # checkout: `gh` works against the API, so the write token never reaches a
  # working tree. Note that a release created with `GITHUB_TOKEN` does not fire
  # `release: published`, so nothing may be keyed on that event.
  #
  # The notes are generated from the merged PRs rather than read from
  # CHANGELOG.md: parsing a section out of the changelog inside YAML is a second
  # place for the release to go wrong, and the changelog is one click away.
  release-page:
    needs: publish
    # Jobs that hold write credentials run on GitHub-hosted runners.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to create."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
